  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="logo">Barely <span>Comics</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>

    <div class="section-header">
      <h2>Comics</h2>
      <span style="color: var(--text-muted); font-size: 0.95rem;">Click any strip to view</span>

    <!-- 
      HOW TO ADD A NEW COMIC:
      1. Put the full comic image in /images/ (e.g. comic-04.jpg)
      2. Copy one of the <a class="card"> blocks below
      3. Change the img src, title, and date
      4. Later you can link each card to its own page if you want
    -->

    <div class="grid">
      <a href="#" class="card">
        <img src="https://placehold.co/400x300/e85d4c/ffffff?text=Comic+1" alt="Comic 1">
        <div class="card-body">
          <div class="card-title">The First One</div>
          <div class="card-meta">August 11, 2026</div>
        </div>
      </a>

      <a href="#" class="card">
        <img src="https://placehold.co/400x300/2c3e50/ffffff?text=Comic+2" alt="Comic 2">
        <div class="card-body">
          <div class="card-title">Coffee Break</div>
          <div class="card-meta">August 8, 2026</div>
        </div>
      </a>

      <a href="#" class="card">
        <img src="https://placehold.co/400x300/27ae60/ffffff?text=Comic+3" alt="Comic 3">
        <div class="card-body">
          <div class="card-title">Monday Mood</div>
          <div class="card-meta">August 4, 2026</div>
        </div>

      <a href="#" class="card">
        <img src="https://placehold.co/400x300/8e44ad/ffffff?text=Comic+4" alt="Comic 4">

      <a href="#" class="card">

          <div class="card-title">Ink & Ideas</div>
          <div class="card-meta">July 12, 2026</div>
        </div>

    <!-- Optional empty state if you have zero comics yet:
    <div class="empty-state">
